### Метаданные F-Droid для Nova.
#
# Это документированный оригинал. В форк fdroiddata уезжает копия без
# комментариев: их полностью вычищает `fdroid rewritemeta`, а их CI сравнивает
# свой прогон rewritemeta с файлом из merge request. Правим здесь, значения
# переносим в metadata/com.brent.nova.yml форка.
#
# Подано: gitlab.com/fdroid/fdroiddata/-/merge_requests/46057, ветка
# com.brent.nova в форке cryptolab.net/fdroiddata.
#
# ЛЮБОЙ ТЕГ в публичном репозитории обязан содержать:
#   * settings.gradle.kts без плагина
#     `org.gradle.toolchains.foojay-resolver-convention` — сканер F-Droid считает
#     его «usual suspect» (плагин умеет докачивать JDK) и останавливает сборку;
#   * каталог `fastlane/metadata/android/<локаль>/` — тексты каталог забирает из
#     дерева собираемого тега, а не из ветки по умолчанию.
# Тег из-за этого переставлялся; проверочные прогоны делались на нём.
#
# После слияния запись о новой версии каталог добавляет сам (`AutoUpdateMode`), а
# `Binaries` заставляет его скачать `Nova_<версия>-fdroid.apk` из релиза этого
# тега. Отсюда правило: тег без эталонного APK в релизе — это красная сборка, и
# никакой merge request об этом уже не спросит.
#
# ЧТО ПРОВЕРЕНО ЛОКАЛЬНО:
#   * лицензия GPL-3.0 (дословный текст FSF);
#   * flavor `fdroid` собирается и в нём выключен встроенный загрузчик обновлений
#     (BuildConfig.UPDATER_ENABLED=false), при этом flavor `github` не изменился;
#   * libtun2proxy_jni.so собирается из src/main/cpp для обеих ABI;
#   * liboperaproxy.so собирается из snawoot-proxies-forks/opera-proxy@v1.15.0-fork
#     (tools/build_opera_proxy.sh) и проверен на устройстве: режим Opera EU
#     поднялся, выходной IP сменился на нидерландский;
#   * libtun2proxy.so собирается из tun2proxy/tun2proxy@v0.7.21
#     (tools/build_tun2proxy.sh), режим Opera EU проверен на устройстве.
#
# ПРОВЕРЕНО ПОЛНЫМ ПРОГОНОМ НА LINUX (WSL, Ubuntu 26.04, fdroidserver 2.4.3):
#   * `fdroid lint com.brent.nova` — чисто, код возврата 0;
#   * `fdroid build -l` (без `-t -f`) — «1 build succeeded»: checkout тега,
#     удаление семи бинарников по `rm`, `scandelete`, local.properties, чистка
#     подписи, `prebuild`, все четыре шага `build` и `assembleFdroidRelease`;
#   * на выходе неподписанный `com.brent.nova_142.apk`, 60,4 МБ: versionCode
#     142, versionName 1.29, только arm64-v8a и armeabi-v7a, 12 нативных
#     библиотек — все собраны в этом же прогоне, x86 в APK нет.
#
# БЛОК `sudo` ПРОВЕРЕН ОТДЕЛЬНО, в чистой Ubuntu 26.04 (fdroidserver выполняет
# его только с `--on-server`): команды склеены через «; » и прогнаны одной
# строкой через `bash -e -u -o pipefail -x -c`, как это делает fdroidserver,
# код возврата 0. Результат: Go 1.26.3, gomobile и gobind в /usr/local/go/bin,
# у пользователя `vagrant` — rustc 1.97.1 с целями aarch64-linux-android и
# armv7-linux-androideabi и cargo-ndk 4.1.2, а `sdkmanager` от root положил
# cmake 3.22.1 (с ninja), platform-35 и build-tools 35.0.1 в SDK, которым root
# владеет — ровно как на их buildserver.
#
# ЧТО НЕ ПРОВЕРЕНО:
#   * прогон целиком именно на их buildserver (`fdroid build --on-server`):
#     локально он покупается ценой `dpkg --purge sudo` и блокировки root.
#   * шаги prebuild/build выполняются в каталоге `subdir`, то есть в `app/`, а не
#     в корне проекта. Переменной `$$SRC$$` в fdroidserver нет: `$$name$$` —
#     это подстановка srclib, и произвольное имя превращается в мусор вида
#     `17374SRC17374`.

Categories:
  - Internet
  - Security

License: GPL-3.0-only

AuthorName: confeden
SourceCode: https://github.com/confeden/Nova-Android
IssueTracker: https://github.com/confeden/Nova-Android/issues

# Приложение работает через несвободные сетевые службы (Cloudflare WARP/MASQUE,
# прокси Opera). Ярлык-предупреждение, а не отказ во включении; указываем сами.
# Пояснение к ярлыку обязательно (замечание рецензента): без него в каталоге
# видно только «NonFreeNet», и непонятно, что именно несвободно.
AntiFeatures:
  NonFreeNet:
    en-US: The built-in transports connect to Cloudflare WARP/MASQUE and Opera's proxy
      servers, whose server side is not free software. Profiles imported by the user
      go to servers of their own choosing.

AutoName: Nova

# Summary/description здесь нет намеренно: рецензент F-Droid просит держать в
# fdroiddata только метаданные сборки, а тексты — в структуре fastlane нашего
# репозитория (`fastlane/metadata/android/<локаль>/`), откуда каталог забирает
# их сам. Так их правит владелец без merge request в fdroiddata.

RepoType: git
Repo: https://github.com/confeden/Nova-Android.git

# Воспроизводимая сборка. `Binaries` — адрес эталонного APK в релизе GitHub:
# F-Droid соберёт своё, сравнит с ним и опубликует эталон, подписанный ключом
# владельца, а `AllowedAPKSigningKeys` закрепляет отпечаток этого сертификата
# (`apksigner verify --print-certs`). Режим выбирается один раз навсегда: перейти
# потом на подпись ключом F-Droid нельзя — у пользователей сменилась бы подпись,
# и обновления перестали бы ставиться.
#
# Ссылка ведёт на отдельный файл `-fdroid`, а не на основной APK релиза. Причин
# две, обе проверены сравнением: основной собран из варианта `github` со
# встроенным загрузчиком обновлений, а F-Droid собирает вариант `fdroid`; и в
# основном лежат секреты владельца (подпись WSS, пароль релея Opera), которых у
# стороннего сборщика нет и быть не должно — они попадают в classes.dex. Эталон
# `-fdroid` — это ровно то, что делает этот рецепт, только подписанное ключом
# владельца через `apksigner`.
#
# Чтобы сравнение проходило, понадобилось (каждое — измеренная причина, не
# перестраховка):
#   * `-trimpath` в gomobile и `--remap-path-prefix` в Rust — иначе в .so
#     попадают абсолютные пути каталога сборки;
#   * свой `Cargo.lock` для tun2proxy: upstream держит его в .gitignore, версии
#     зависимостей разрешались заново на каждой сборке;
#   * патч `build.rs` tun2proxy: он зашивал в бинарник `chrono::Utc::now()`;
#   * `vcsInfo.include = false` в Gradle: AGP кладёт в APK снимок состояния git
#     той машины, где шла сборка.
Binaries: https://github.com/confeden/Nova-Android/releases/download/v%v/Nova_%v-fdroid.apk
AllowedAPKSigningKeys: 8440f6c63f26d461fefa6f7556303dac762768f9daeb31de01598ff55dc9336f

Builds:
  - versionName: '1.30'
    versionCode: 149
    commit: v1.30
    subdir: app
    gradle:
      - fdroid

    # Собранных бинарников в сборке быть не должно. Удаляем то, что лежит в
    # репозитории, чтобы APK заведомо содержал только собранное здесь: если
    # какой-то шаг ниже отвалится, сборка упадёт, а не подсунет готовый файл.
    rm:
      - app/src/main/jniLibs/arm64-v8a/libgojni.so
      - app/src/main/jniLibs/armeabi-v7a/libgojni.so
      - app/src/main/jniLibs/arm64-v8a/liboperaproxy.so
      - app/src/main/jniLibs/armeabi-v7a/liboperaproxy.so
      - app/src/main/jniLibs/arm64-v8a/libtun2proxy.so
      - app/src/main/jniLibs/armeabi-v7a/libtun2proxy.so
      - app/libs/nova-core-api24-stripped.aar

    # NDK закреплён: этой же версией собирается Go-ядро, расхождение даёт
    # несовместимости, заметные только на устройстве.
    ndk: 27.2.12479018

    # gvisor держит в своём дереве готовые бинарники «sentry» — образы VDSO и
    # sighandler под amd64/arm64. Nova берёт из gvisor только сетевой стек
    # (pkg/tcpip), sentry не собирается и в APK не попадает, поэтому каталог
    # удаляется до сканирования: в дереве сборки готовых бинарников не остаётся
    # вообще. Каталог появляется на шаге prebuild, до сканирования.
    scandelete:
      - build/deps/gvisor/pkg/sentry

    sudo:
      - apt-get update
      - apt-get install -y curl build-essential pkg-config unzip
      # Go нужен свежее того, что есть в Debian: nova-core требует go 1.26.3.
      - curl -sSL -o /tmp/go.tgz https://go.dev/dl/go1.26.3.linux-amd64.tar.gz
      - echo "2b2cfc7148493da5e73981bffbf3353af381d5f93e789c82c79aff64962eb556  /tmp/go.tgz" | sha256sum -c -
      - rm -rf /usr/local/go
      - tar -C /usr/local -xzf /tmp/go.tgz
      # Ядро собирается `gomobile bind`, поэтому нужен сам gomobile. Версия та
      # же, что у golang.org/x/mobile в nova-core/go.mod: bind-код и рантайм
      # должны быть из одной ревизии. Ставим в /usr/local/go/bin — этот каталог
      # шаги сборки и так добавляют в PATH.
      - GOBIN=/usr/local/go/bin /usr/local/go/bin/go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260120165949-40bd9ace6ce4
      - GOBIN=/usr/local/go/bin /usr/local/go/bin/go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260120165949-40bd9ace6ce4
      # Rust нужен для tun2proxy. Ставим rustup, а не пакеты Debian: в них нет
      # стандартной библиотеки под Android, без которой кросс-сборки не будет.
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
      # Версии закреплены: `stable` и «последний cargo-ndk» переезжают со временем,
      # и та же сборка через месяц дала бы другой libtun2proxy.so — воспроизводимость
      # сломалась бы молча.
      - su vagrant -c 'RUSTUP_INIT_SKIP_PATH_CHECK=yes sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.97.1 --no-modify-path'
      - su vagrant -c '$HOME/.cargo/bin/rustup target add aarch64-linux-android armv7-linux-androideabi'
      - su vagrant -c '$HOME/.cargo/bin/cargo install cargo-ndk --version 4.1.2 --locked'
      # CMake из SDK. В их образе его нет вообще: из apt ставятся только JDK,
      # apksigner, curl, git, unzip, patch, rsync и sdkmanager, а внутри SDK
      # запись для сборщика открыта намеренно только в `build-tools` и
      # `platforms` (их provision-android-sdk: «allow gradle to install newer
      # build-tools and platforms»), то есть каталог `cmake` создать некому.
      # Nova без него не собирается: JNI-слой к tun2proxy идёт через CMake, и
      # версия закреплена в app/build.gradle.kts. Ставим их же `sdkmanager` от
      # root. Platform и build-tools указаны явно, чтобы не зависеть от того,
      # что догрузит сам Gradle: собирается ровно то, на чём проверено.
      # ANDROID_HOME берётся из /etc/profile.d/bsenv.sh, который создаёт их
      # provisioning: `sudo` вычищает окружение, и переменной в шаге нет. Файл и
      # `sdkmanager` — отдельными командами: список шагов не должен склеивать
      # команды через «;» или «&&» (замечание рецензента), а окружение всё равно
      # переносится — весь список исполняет одна оболочка. Нет файла — команда
      # упадёт вслух, молчаливого пропуска не будет.
      - . /etc/profile.d/bsenv.sh
      - sdkmanager "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.1"

    prebuild:
      # Go-зависимости ядра: пять проектов подключены через `replace` по путям на
      # диске, три из них пропатчены. Скрипт тянет закреплённые коммиты и
      # накладывает патчи из tools/deps/patches — то есть сборка воспроизводима.
      #
      # Скрипты запускаются через `bash`, а не напрямую: в репозитории они лежат
      # с режимом 100644 (собираются на Windows, где git не хранит бит +x), и
      # прямой вызов на Linux даёт «Permission denied».
      #
      # `cd` — отдельным шагом. Весь список исполняет одна оболочка, поэтому
      # смена каталога переносится на следующие шаги; склеивать команды через
      # «&&» нельзя (замечание рецензента), а отдельный `cd` заодно честнее:
      # неудачный `cd` внутри «&&»-списка `set -e` не считает и молча оставляет
      # остальные шаги работать не в том каталоге.
      - cd ..
      - PATH=/usr/local/go/bin:$PATH bash tools/deps/fetch_go_deps.sh
      # Иначе Gradle сам ищет JVM по системе и может взять для toolchain любую,
      # включая JRE без компилятора: локальный прогон падал на «Toolchain
      # installation … does not provide the required capabilities:
      # [JAVA_COMPILER]». С выключенным поиском берётся JVM, на которой запущен
      # сам Gradle, то есть результат не зависит от набора JVM на машине сборки.
      # Свойство читается только из gradle.properties: через `gradleprops` оно
      # уезжает как `-P`, а такие настройки Gradle из `-P` не берёт — проверено.
      # `printf` с переводом строки в начале обязателен: gradle.properties в
      # репозитории заканчивается без перевода строки, и `echo >>` приклеивает
      # строку к `org.gradle.workers.max=8`, ломая обе.
      - printf '\norg.gradle.java.installations.auto-detect=false\n' >> gradle.properties

    # Каждый шаг — одна команда. Список исполняет одна оболочка, поэтому смена
    # каталога переносится дальше по списку, и `cd` стоит отдельными шагами.
    # Начинается список в каталоге `subdir`, то есть в `app/`, — отсюда первый
    # `cd ..`; шаги `prebuild` и `build` исполняются разными оболочками, так что
    # каталог для `build` надо задавать заново.
    build:
      - cd ..
      # 1. Ядро nova-core (libgojni.so + .aar).
      - PATH=/usr/local/go/bin:$PATH ANDROID_NDK_HOME=$$NDK$$ bash tools/build_nova_core_aar.sh
      # 2. Ядро Xray для VLESS+REALITY (libnovaxray.so, libnovaxrayjni.so).
      - cd nova-xray
      - PATH=/usr/local/go/bin:$PATH ANDROID_NDK_HOME=$$NDK$$ bash build.sh
      - cd ..
      # 3. opera-proxy: клонируется по закреплённому тегу и собирается на месте.
      - PATH=/usr/local/go/bin:$PATH ANDROID_NDK_HOME=$$NDK$$ bash tools/build_opera_proxy.sh
      # 4. tun2proxy: тег закреплён на последней версии с нужным нам C-API.
      - PATH=$HOME/.cargo/bin:$PATH ANDROID_NDK_HOME=$$NDK$$ bash tools/build_tun2proxy.sh

    # Секрет подписи WSS есть только у владельца; стороннему сборщику запрет не
    # нужен и снимается явным флагом. Работают при этом все транспорты, кроме
    # релея Telegram через собственные поддомены. Флага `env` в fdroidserver нет
    # (поймано `fdroid lint`), поэтому значение идёт свойством Gradle.
    gradleprops:
      - novaAllowUnsignedRelease=true

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: '1.30'
CurrentVersionCode: 149
