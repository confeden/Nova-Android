# Nova DNS tunnel (StormDNS + Nova dialect). Tuned for 1 vCPU / 548 MB.
DOMAIN = ["t.nova-app.eu"]
PROTOCOL_TYPE = "SOCKS5"
SUPPORTED_UPLOAD_COMPRESSION_TYPES = [0, 1, 2, 3]
SUPPORTED_DOWNLOAD_COMPRESSION_TYPES = [0, 1, 2, 3]
UDP_HOST = "191.44.41.242"
UDP_PORT = 53
UDP_READERS = 2
DNS_REQUEST_WORKERS = 2
MAX_CONCURRENT_REQUESTS = 2048
SOCKET_BUFFER_SIZE = 4194304
MAX_PACKET_SIZE = 65535
DEFERRED_SESSION_WORKERS = 2
DEFERRED_SESSION_QUEUE_LIMIT = 1024
SESSION_ORPHAN_QUEUE_INITIAL_CAPACITY = 32
STREAM_QUEUE_INITIAL_CAPACITY = 64
DNS_FRAGMENT_STORE_CAPACITY = 256
SOCKS5_FRAGMENT_STORE_CAPACITY = 256
MAX_STREAMS_PER_SESSION = 64
MAX_DNS_RESPONSE_BYTES = 32768
INVALID_COOKIE_WINDOW_SECONDS = 2.0
INVALID_COOKIE_ERROR_THRESHOLD = 10
SESSION_TIMEOUT_SECONDS = 300.0
SESSION_CLEANUP_INTERVAL_SECONDS = 30.0
CLOSED_SESSION_RETENTION_SECONDS = 300.0
SESSION_INIT_REUSE_TTL_SECONDS = 300.0
RECENTLY_CLOSED_STREAM_TTL_SECONDS = 300.0
RECENTLY_CLOSED_STREAM_CAP = 1000
DNS_UPSTREAM_SERVERS = ["1.1.1.1:53", "8.8.8.8:53"]
DNS_UPSTREAM_TIMEOUT = 4.0
DNS_CACHE_MAX_RECORDS = 5000
DNS_CACHE_TTL_SECONDS = 300.0
SOCKS_CONNECT_TIMEOUT = 20.0
USE_EXTERNAL_SOCKS5 = false
SOCKS5_AUTH = false
DATA_ENCRYPTION_METHOD = 5
ENCRYPTION_KEY_FILE = "/etc/stormdns/encrypt_key.txt"
ARQ_WINDOW_SIZE = 512
LOG_LEVEL = "INFO"
CONFIG_VERSION = "10"
